[build]
  functions = "netlify/functions"

# Map the same relative URLs the frontend uses onto the serverless functions,
# so no secrets ever live in client-side code.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
